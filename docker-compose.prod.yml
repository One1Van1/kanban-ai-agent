version: '3.8'

services:
  # 🗄️ PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kanban-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanban_ai_prod
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./kan-back/src/database/migrations:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    networks:
      - kanban-network

  # 🔴 Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kanban-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - kanban-network

  # 🏗️ Backend API
  backend:
    build:
      context: ./kan-back
      dockerfile: Dockerfile
      target: production
    container_name: kanban-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kanban_user:${DATABASE_PASSWORD}@postgres:5432/kanban_ai_prod
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
    networks:
      - kanban-network
    volumes:
      - ./logs:/app/logs

  # 🎨 Frontend App
  frontend:
    build:
      context: ./kan-front
      dockerfile: Dockerfile
      target: production
    container_name: kanban-frontend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:3000/api
    ports:
      - '3001:3000'
    depends_on:
      - backend
    networks:
      - kanban-network

  # 🔄 Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: kanban-nginx-prod
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - kanban-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kanban-network:
    driver: bridge
