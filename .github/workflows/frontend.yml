# 🎨 Frontend CI/CD Pipeline
name: Frontend CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - 'kan-front/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'kan-front/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: kan-front

jobs:
  # ✅ Code Quality Checks
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: kan-front/yarn.lock

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 Type checking
        run: yarn type-check

      - name: 🧹 Lint check
        run: yarn lint

      - name: 🎨 Format check
        run: yarn format:check

  # 🧪 Unit Tests
  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: kan-front/yarn.lock

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🧪 Run unit tests
        run: yarn test --coverage --watchAll=false

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./kan-front/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # 🎭 E2E Tests
  test-e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: kan-front/yarn.lock

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🎭 Install Playwright
        run: yarn playwright install --with-deps chromium

      - name: 🏗️ Build application
        run: yarn build

      - name: 🧪 Run E2E tests
        run: yarn test:e2e

      - name: 📸 Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: kan-front/playwright-report/
          retention-days: 30

  # 📊 Performance Tests
  performance:
    name: 📊 Performance Audit
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: kan-front/yarn.lock

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build application
        run: yarn build

      - name: 📊 Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # 🔒 Security Audit
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: kan-front/yarn.lock

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔒 Security audit
        run: yarn audit --level high

      - name: 📦 Bundle analyzer
        run: yarn analyze

      - name: 📊 Upload bundle analysis
        uses: actions/upload-artifact@v3
        with:
          name: bundle-analysis
          path: kan-front/.next/analyze/
          retention-days: 30

  # 🚀 Build and Deploy
  build:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    needs: [test-unit, test-e2e, performance, security]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: kan-front/yarn.lock

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build application
        run: yarn build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PRODUCTION_API_URL }}

      - name: 📦 Export static files
        run: yarn export

      - name: 🐳 Build Docker image
        run: |
          docker build -t kanban-frontend:${{ github.sha }} .
          docker tag kanban-frontend:${{ github.sha }} kanban-frontend:latest

      - name: 📦 Archive production artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-dist
          path: kan-front/out/
          retention-days: 30

      # Deploy to Vercel (optional)
      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: github.ref == 'refs/heads/main'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: kan-front
