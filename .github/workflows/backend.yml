# 🏗️ Backend CI/CD Pipeline
name: Backend CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - 'kan-back/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'kan-back/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: kan-back

jobs:
  # ✅ Code Quality Checks
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: kan-back/yarn.lock

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 Type checking
        run: yarn tsc --noEmit

      - name: 🧹 Lint check
        run: yarn lint

      - name: 🎨 Format check
        run: yarn format:check

  # 🧪 Unit Tests
  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanban_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: kan-back/yarn.lock

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build application
        run: yarn build

      - name: 🧪 Run unit tests
        run: yarn test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanban_test
          REDIS_URL: redis://localhost:6379

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./kan-back/coverage/lcov.info
          flags: backend
          name: backend-coverage

  # 🔒 Security Audit
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: kan-back/yarn.lock

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔒 Security audit
        run: yarn audit --level high

      - name: 🔍 License check
        run: yarn license-checker --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause'

  # 🚀 Build and Deploy
  build:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    needs: [test-unit, security]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: kan-back/yarn.lock

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build application
        run: yarn build

      - name: 🐳 Build Docker image
        run: |
          docker build -t kanban-backend:${{ github.sha }} .
          docker tag kanban-backend:${{ github.sha }} kanban-backend:latest

      - name: 📦 Archive production artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-dist
          path: kan-back/dist/
          retention-days: 30
