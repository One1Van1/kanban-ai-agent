# 🔄 Monorepo CI/CD Pipeline
name: Monorepo CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # 🔍 Detect Changes
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      root: ${{ steps.changes.outputs.root }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'kan-back/**'
            frontend:
              - 'kan-front/**'
            root:
              - 'package.json'
              - 'yarn.lock'
              - 'docker-compose*.yml'
              - 'scripts/**'

  # 🏗️ Root Dependencies
  setup:
    name: 🏗️ Setup Root
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.root == 'true'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: 📥 Install root dependencies
        run: yarn install --frozen-lockfile

      - name: 🧪 Test monorepo scripts
        run: |
          chmod +x scripts/*.sh
          ./scripts/clean-ports.sh

      - name: 🐳 Test Docker setup
        run: |
          docker-compose -f docker-compose.dev.yml config
          docker-compose config

  # 🔄 Call Backend Workflow
  backend:
    name: 🏗️ Backend Pipeline
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  # 🔄 Call Frontend Workflow
  frontend:
    name: 🎨 Frontend Pipeline
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  # 🧪 Integration Tests
  integration:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: |
      always() && 
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanban_integration
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: 📥 Install dependencies
        run: yarn install:all

      - name: 🏗️ Build both applications
        run: yarn build

      - name: 🚀 Start applications
        run: |
          yarn start:back &
          yarn start:front &
          sleep 30
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanban_integration
          REDIS_URL: redis://localhost:6379
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: 🧪 Run integration tests
        run: |
          curl -f http://localhost:3000/health || exit 1
          curl -f http://localhost:3001 || exit 1

      - name: 🎭 Run E2E integration tests
        run: |
          cd kan-front
          yarn playwright install --with-deps chromium
          yarn test:e2e:integration
        env:
          BASE_URL: http://localhost:3001
          API_URL: http://localhost:3000

  # 📊 Quality Report
  quality-report:
    name: 📊 Quality Report
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration]
    if: always()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Generate quality report
        run: |
          echo "# 📊 Quality Report" > quality_report.md
          echo "" >> quality_report.md
          echo "## 🏗️ Backend: ${{ needs.backend.result }}" >> quality_report.md
          echo "## 🎨 Frontend: ${{ needs.frontend.result }}" >> quality_report.md
          echo "## 🧪 Integration: ${{ needs.integration.result }}" >> quality_report.md
          echo "" >> quality_report.md
          echo "Generated at: $(date)" >> quality_report.md

      - name: 💬 Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quality_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  # 🚀 Deploy
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.integration.result == 'success'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to production
        run: |
          echo "🚀 Deploying AI Kanban Agent to production..."
          # Add your deployment commands here

      - name: 📢 Notify deployment
        run: |
          echo "✅ Deployment completed successfully!"
          # Add notification logic here (Slack, Discord, etc.)
